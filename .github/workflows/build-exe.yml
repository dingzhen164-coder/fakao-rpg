# 用户明确“统一验证并发布”后，合入 main 并显式请求发布 → 在 Windows 上打包 fakao-mage.exe、在 Linux 上打包平板 App fakao-mage.apk、
# 在 Mac 上打包 法师成长记.app（Apple 芯片，fakao-mage-mac.zip），
# 一起发到 Releases（tag v<版本>）
# 程序里「设置 → 🆕 版本与更新 → 检查更新」读的就是这里发的 Release
name: build-exe

on:
  push:
    branches: [main, 'validate/**']
    paths: [.github/release-request.json]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  ui:
    # 日常 dev 推送不打包；手动选择开发分支也不允许发布。
    if: startsWith(github.ref, 'refs/heads/validate/')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Isolate test HOME
        run: |
          mkdir -p "$RUNNER_TEMP/fakao-isolated-home"
          echo "HOME=$RUNNER_TEMP/fakao-isolated-home" >> "$GITHUB_ENV"
          echo "USERPROFILE=$RUNNER_TEMP/fakao-isolated-home" >> "$GITHUB_ENV"
      - name: Install browser test tools
        timeout-minutes: 10
        run: |
          # Azure镜像曾将字体/浏览器依赖下载限速到44KB/s；使用官方HTTPS源，保留APT签名校验。
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          pip install playwright pymupdf pillow
          npm install --no-save playwright jsdom
          npx playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Check scene layout regression
        run: node tests/test_scene_portal.cjs
      - name: Scene panels, trial hall, contest and map/shelf regressions
        run: |
          node tests/ui_scene_panels.cjs
          node tests/ui_trial_hall.cjs --shots
          node tests/ui_contest_scene.cjs --shots
          node tests/ui_layout335.cjs --shots
      - name: Task board, reading viewport and built-in art
        run: |
          node tests/ui_task_board.cjs
          node tests/ui_layout337.cjs
          node tests/ui_art338.cjs
      - name: Training workspace, scene clock and folded entry
        run: |
          node tests/ui_training339.cjs
          node tests/ui_daylight339.cjs
          node tests/ui_mock_html.cjs
          node tests/ui_mock_details.cjs
          node tests/ui_mock_imports.cjs
          node tests/ui_fixes359.cjs
          node tests/ui_zoom359.cjs
          node tests/ui_tablet_shell.cjs
          node tests/test_pen_guard.cjs
          node tests/ui_pen_draw.cjs
          node tests/ui_knowledge.cjs
      - name: Complete layout and narrative checks
        run: |
          node tests/ui_academy.cjs
          node tests/test_narrative_ink.cjs
          node tests/test_journey_dom.cjs
          node tests/ui_map_navigation.cjs
          node tests/ui_status_navigation.cjs
          node tests/ui_study_regions.cjs
          node tests/ui_fixed_layout.cjs
          node tests/ui_grouped_rewards.cjs
          node tests/ui_compact_review.cjs
          node tests/ui_mac_update.cjs
          node tests/ui_workspace_309.cjs
          node tests/ui_reader_310.cjs
          node tests/ui_narrative.cjs
          node tests/ui_world.cjs
          node tests/ui_layout_check.cjs
      - name: Check exams UI
        run: CHROMIUM_PATH=$(node -e "process.stdout.write(require('playwright').chromium.executablePath())") python tests/smoke_exams_ui.py ui-screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exams-ui-screenshots
          path: |
            ui-screenshots/
            ui-artifacts/
  build:
    if: startsWith(github.ref, 'refs/heads/validate/')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Isolate test HOME
        shell: bash
        run: |
          python - <<'PYHOME'
          import os
          from pathlib import Path
          home = Path(os.environ['RUNNER_TEMP']) / 'fakao-isolated-home'
          home.mkdir(parents=True, exist_ok=True)
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as f:
              for key in ('HOME', 'USERPROFILE'):
                  f.write(key + '=' + str(home) + '\n')
          PYHOME

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install pyinstaller pywebview segno pymupdf numpy opencv-python-headless pillow certifi

      - name: Tests
        run: python -m unittest discover -s tests

      - name: Build exe
        run: >
          pyinstaller --noconfirm --onefile --windowed --name fakao-mage
          --icon web/icons/app.ico
          --add-data "web;web" --add-data "defaults;defaults" --add-data "rpg/data;rpg/data"
          --hidden-import server --collect-submodules rpg
          --hidden-import segno --collect-all pymupdf --collect-all webview --hidden-import cv2 --hidden-import numpy
          app.py

      - name: Smoke test
        shell: pwsh
        run: |
          $out = & dist/fakao-mage.exe --run-script tests/smoke_frozen.py | Out-String
          Write-Output $out
          if ($out -notmatch "SMOKE-OK") { throw "frozen smoke test failed" }

      - name: Relaunch test (一键更新换文件后能重新打开)
        shell: pwsh
        run: |
          $d = Join-Path $env:RUNNER_TEMP "relaunch"
          New-Item -ItemType Directory -Force $d | Out-Null
          Copy-Item dist/fakao-mage.exe "$d/app.exe"
          Copy-Item dist/fakao-mage.exe "$d/app.new.exe"
          $log = Join-Path $HOME ".fakao-rpg/启动日志.txt"
          Remove-Item $log -ErrorAction SilentlyContinue
          & "$d/app.exe" --run-script tests/smoke_relaunch.py "$d/app.new.exe" "$d/app.exe" | Out-String | Write-Output
          $ok = $false
          for ($i = 0; $i -lt 60; $i++) {
            Start-Sleep -Seconds 1
            if ((Test-Path $log) -and ((Get-Content $log -Raw -Encoding utf8) -match "已启动")) { $ok = $true; break }
          }
          if (Test-Path $log) { Get-Content $log -Encoding utf8 | Write-Output }
          Get-Process app -ErrorAction SilentlyContinue | Stop-Process -Force
          if (Test-Path "$d/app.new.exe") { throw "新 exe 没换上去" }
          if (-not $ok) { throw "换文件后重开的程序没起来" }

      - uses: actions/upload-artifact@v4
        with:
          name: package-windows
          path: dist/fakao-mage.exe
          if-no-files-found: error
          retention-days: 7

  apk:
    if: startsWith(github.ref, 'refs/heads/validate/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build apk
        run: bash android/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: package-apk
          path: android/build/fakao-mage.apk
          if-no-files-found: error
          retention-days: 7

  mac:
    if: startsWith(github.ref, 'refs/heads/validate/')
    runs-on: macos-latest          # Apple 芯片（M / A 系列）
    steps:
      - uses: actions/checkout@v4

      - name: Isolate test HOME
        run: |
          mkdir -p "$RUNNER_TEMP/fakao-isolated-home"
          echo "HOME=$RUNNER_TEMP/fakao-isolated-home" >> "$GITHUB_ENV"
          echo "USERPROFILE=$RUNNER_TEMP/fakao-isolated-home" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install pyinstaller pywebview segno pymupdf numpy opencv-python-headless pillow pyobjc-framework-Vision certifi

      - name: Build app
        run: >
          pyinstaller --noconfirm --windowed --name FakaoMage
          --osx-bundle-identifier com.fakao.mage
          --icon web/icons/icon-512.png
          --add-data "web:web" --add-data "defaults:defaults" --add-data "rpg/data:rpg/data"
          --hidden-import server --collect-submodules rpg
          --hidden-import segno --collect-all pymupdf --hidden-import cv2 --hidden-import numpy
          --hidden-import Vision --hidden-import Foundation
          app.py

      - name: Name, version, sign, zip
        run: |
          V=$(sed -n 's/^VERSION = "\(.*\)"/\1/p' rpg/version.py)
          APP="dist/法师成长记.app"
          mv dist/FakaoMage.app "$APP"
          P="$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleName 法师成长记" "$P"
          /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string 法师成长记" "$P" || /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName 法师成长记" "$P"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $V" "$P"
          /usr/libexec/PlistBuddy -c "Add :NSHighResolutionCapable bool true" "$P" || true
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep "$APP"
          (cd dist && ditto -c -k --sequesterRsrc --keepParent "法师成长记.app" ../fakao-mage-mac.zip)
          ls -l fakao-mage-mac.zip

      - name: Smoke test
        run: |
          out=$("dist/法师成长记.app/Contents/MacOS/FakaoMage" --run-script tests/smoke_frozen.py)
          echo "$out"
          echo "$out" | grep -q SMOKE-OK

      - name: Mac update restart smoke
        run: |
          out=$("dist/法师成长记.app/Contents/MacOS/FakaoMage" --run-script tests/smoke_mac_update.py fakao-mage-mac.zip)
          echo "$out"
          echo "$out" | grep -q MAC-UPDATE-FROZEN-OK

      - uses: actions/upload-artifact@v4
        with:
          name: package-mac
          path: fakao-mage-mac.zip
          if-no-files-found: error
          retention-days: 7

  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Publish verified packages without rebuilding
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/publish_validated.py
