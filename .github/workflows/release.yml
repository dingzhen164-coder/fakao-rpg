name: Test and release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'
      - run: python -m unittest discover -s tests -v
      - run: python scripts/smoke.py python server.py
  ui:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare Chinese font for screenshot verification
        run: |
          mkdir -p "$RUNNER_TEMP/fakao-fonts"
          curl --fail --location --retry 2 https://raw.githubusercontent.com/notofonts/noto-cjk/main/Sans/OTF/SimplifiedChinese/NotoSansCJKsc-Regular.otf --output "$RUNNER_TEMP/fakao-fonts/NotoSansCJKsc-Regular.otf"
          printf '<fontconfig><include ignore_missing="yes">/etc/fonts/fonts.conf</include><dir>%s/fakao-fonts</dir></fontconfig>' "$RUNNER_TEMP" > "$RUNNER_TEMP/fakao-fontconfig.xml"
          echo "FONTCONFIG_FILE=$RUNNER_TEMP/fakao-fontconfig.xml" >> "$GITHUB_ENV"
          FONTCONFIG_FILE="$RUNNER_TEMP/fakao-fontconfig.xml" fc-match -f '%{file}\n' 'sans:lang=zh'
      - name: Browser checks with runner Chrome
        run: node scripts/ui-check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-screenshots
          path: screenshots
  desktop:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: faguan-growth-windows.exe
          - os: macos-latest
            asset: faguan-growth-mac-arm64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build tool only
        run: pip install pyinstaller
      - name: Windows package
        if: runner.os == 'Windows'
        run: pyinstaller --noconfirm --onefile --name faguan-growth-windows --add-data "web;web" server.py
      - name: Windows smoke
        if: runner.os == 'Windows'
        run: python scripts/smoke.py dist/faguan-growth-windows.exe
      - name: Mac package
        if: runner.os == 'macOS'
        run: |
          pyinstaller --noconfirm --windowed --name FaguanGrowth --osx-bundle-identifier com.fakao.growth --add-data "web:web" server.py
          python scripts/smoke.py dist/FaguanGrowth.app/Contents/MacOS/FaguanGrowth
          mv dist/FaguanGrowth.app "dist/法官成长记.app"
          /usr/libexec/PlistBuddy -c "Set :CFBundleName 法官成长记" "dist/法官成长记.app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 1.0.0" "dist/法官成长记.app/Contents/Info.plist"
          codesign --force --deep --sign - "dist/法官成长记.app"
          codesign --verify --deep "dist/法官成长记.app"
          ditto -c -k --sequesterRsrc --keepParent "dist/法官成长记.app" "dist/faguan-growth-mac-arm64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: android/signing
          key: fakao-debug-signing-v1
      - run: bash android/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: faguan-growth-android.apk
          path: android/build/faguan-growth-android.apk
  publish:
    needs: [desktop, android, ui]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(python -c "from rpg.version import VERSION; print(VERSION)")
          python -c "from pathlib import Path; t=Path('changelog.md').read_text(); Path('release-notes.md').write_text(t.split('## ',1)[1])"
          if gh release view "v$V" >/dev/null 2>&1; then
            gh release upload "v$V" dist/faguan-growth-windows.exe dist/faguan-growth-mac-arm64.zip dist/faguan-growth-android.apk --clobber
          else
            gh release create "v$V" dist/faguan-growth-windows.exe dist/faguan-growth-mac-arm64.zip dist/faguan-growth-android.apk --title "法官成长记 v$V" --notes-file release-notes.md
          fi
          for NAME in $(gh release view "v$V" --json assets --jq '.assets[].name | select(endswith(".png") or . == "verification.json")'); do
            gh release delete-asset "v$V" "$NAME" --yes
          done
          gh release view "v$V" --json assets --jq '.assets[].name'
